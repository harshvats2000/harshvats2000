name: Update profile card

on:
  schedule:
    - cron: "0 0 * * *" # daily, keeps Uptime and GitHub stats current
  workflow_dispatch:
  push:
    branches: [master]
    paths: [generate.py, ascii.txt]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVGs
        run: python3 generate.py
        env:
          # Optional STATS_TOKEN (a personal access token) counts private contributions too.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || (git commit -m "Update profile card" && git push)
